<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f7d4f" />
<title>NutriAI – Log in</title>
<style>
  :root { --bg:#f5f6f3; --card:#fff; --ink:#1d2420; --muted:#6b756f; --accent:#2f7d4f; --accent2:#e8efe9;
          --line:#e2e6e1; --bad:#b3261e; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink);
         font-size:16px; display:flex; align-items:center; justify-content:center; min-height:100vh;
         padding:24px 16px; }
  .box { width:100%; max-width:420px; }
  .brand { text-align:center; margin-bottom:20px; }
  .brand .logo { width:56px; height:56px; border-radius:16px; background:var(--accent); color:#fff; display:inline-flex;
                 align-items:center; justify-content:center; font-size:28px; font-weight:700; }
  .brand h1 { font-size:24px; margin:10px 0 2px; }
  .brand p { margin:0; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--bg); border-radius:10px; padding:4px; margin-bottom:18px; }
  .tabs button { border:0; background:none; padding:10px; border-radius:8px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:14px; }
  input { display:block; width:100%; margin-top:6px; font:inherit; font-size:16px; color:var(--ink); padding:12px; border:1px solid var(--line);
          border-radius:10px; background:#fff; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  .pw { position:relative; display:block; }
  .pw input { padding-right:64px; }
  .pw button { position:absolute; right:6px; top:50%; transform:translateY(-50%); margin-top:3px; border:0; background:none;
               color:var(--accent); font:inherit; font-size:14px; font-weight:600; padding:8px; cursor:pointer; }
  .go { width:100%; border:0; border-radius:10px; padding:14px; font:inherit; font-weight:700; background:var(--accent); color:#fff;
        cursor:pointer; margin-top:4px; }
  .go:disabled { opacity:.6; cursor:wait; }
  .error { background:#fbeaea; color:var(--bad); border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:14px; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin-top:16px; }
  .muted { color:var(--muted); font-size:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="logo">N</div>
    <h1 id="clinic">NutriAI</h1>
    <p>Your personal nutrition plan</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button id="tLogin" class="on" type="button" onclick="show('login')">Log in</button>
      <button id="tSignup" type="button" onclick="show('signup')">Create account</button>
    </div>
    <div id="error" class="error" hidden></div>

    <form id="login" autocomplete="on">
      <label>Email or phone
        <input name="login" autocomplete="username" required autocapitalize="off" spellcheck="false" /></label>
      <label>Password
        <span class="pw"><input name="password" type="password" autocomplete="current-password" required />
        <button type="button" onclick="togglePw(this)">Show</button></span></label>
      <button class="go" type="submit">Log in</button>
      <p class="hint">Forgot your password? Ask your nutritionist to reset it.</p>
    </form>

    <form id="signup" hidden autocomplete="on">
      <label>Full name <input name="name" autocomplete="name" required /></label>
      <label>Phone number <input name="phone" type="tel" autocomplete="tel" placeholder="+961 3 123 456" required /></label>
      <label>Email <input name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" required /></label>
      <label>Password <span class="muted">(at least 8 characters)</span>
        <span class="pw"><input name="password" type="password" autocomplete="new-password" minlength="8" required />
        <button type="button" onclick="togglePw(this)">Show</button></span></label>
      <button class="go" type="submit">Create account</button>
      <p class="hint">Your nutritionist will see your account and prepare your plan.</p>
    </form>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

function show(which) {
  $("#login").hidden = which !== "login";
  $("#signup").hidden = which !== "signup";
  $("#tLogin").classList.toggle("on", which === "login");
  $("#tSignup").classList.toggle("on", which === "signup");
  $("#error").hidden = true;
  $(`#${which} input`).focus();
}

function togglePw(btn) {
  const inp = btn.previousElementSibling;
  inp.type = inp.type === "password" ? "text" : "password";
  btn.textContent = inp.type === "password" ? "Show" : "Hide";
}

async function submit(form, url) {
  const btn = form.querySelector(".go"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Please wait…"; $("#error").hidden = true;
  try {
    const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" },
                                 body: JSON.stringify(Object.fromEntries(new FormData(form))) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "Something went wrong. Try again.");
    location.href = data.role === "admin" ? "/" : "/me";
  } catch (e) {
    $("#error").textContent = e.message; $("#error").hidden = false;
    btn.disabled = false; btn.textContent = label;
  }
}

$("#login").onsubmit = e => { e.preventDefault(); submit(e.target, "/api/auth/login"); };
$("#signup").onsubmit = e => { e.preventDefault(); submit(e.target, "/api/auth/signup"); };
if (location.hash === "#signup") show("signup");

fetch("/api/clinic").then(r => r.json()).then(d => { if (d.clinic) { $("#clinic").textContent = d.clinic; document.title = d.clinic; } }).catch(() => {});
</script>
</body>
</html>
